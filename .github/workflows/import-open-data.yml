name: Import open data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Jeu à importer (check vérifie le socle)
        required: true
        type: choice
        default: check
        options: [check, camino, icpe, tresor_gels, all]
  schedule:
    # Mensuel : tous les jeux volumineux.
    - cron: '17 3 4 * *'
    # Quotidien : le registre des gels (DG Trésor) uniquement — un contrôle de
    # sanctions ne doit pas reposer sur une copie vieille d'un mois.
    - cron: '47 4 * * *'

permissions:
  contents: read

concurrency:
  group: import-open-data
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.OPEN_DATA_IMPORTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    # Trois sources séquentielles (Camino et ICPE ≤ 25 min chacune, gels ≈ 1 min), plus installation.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Vérifier ou importer
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          IMPORT_SOURCE: ${{ inputs.source || (github.event.schedule == '47 4 * * *' && 'tresor_gels') || 'all' }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx --no-install tsx scripts/import/run.ts "$IMPORT_SOURCE"
