name: Import open data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Jeu à importer (check vérifie le socle)
        required: true
        type: choice
        default: check
        options: [check, camino, icpe, tresor_gels, hatvp, decp, sanctions, daily, all]
  schedule:
    # Mensuel : tous les jeux volumineux.
    - cron: '17 3 4 * *'
    # Quotidien : le registre des gels (DG Trésor) et les listes de sanctions
    # internationales — un contrôle de sanctions ne doit pas reposer sur une copie
    # vieille d'un mois.
    - cron: '47 4 * * *'

permissions:
  contents: read

concurrency:
  group: import-open-data
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.OPEN_DATA_IMPORTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    # Camino, ICPE et HATVP ≤ 25 min chacun ; gels et listes de sanctions ≈ 1 min chacun ;
    # DECP ≤ 28 min pour la sélection complète ; plus installation.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Vérifier ou importer
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          IMPORT_SOURCE: ${{ inputs.source || (github.event.schedule == '47 4 * * *' && 'daily') || 'all' }}
          # Personnes physiques des listes de sanctions (migration 0020 appliquée d'abord).
          SANCTIONS_PERSONS_IMPORT_ENABLED: ${{ vars.SANCTIONS_PERSONS_IMPORT_ENABLED }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx --no-install tsx scripts/import/run.ts "$IMPORT_SOURCE"
